# Gradle memory for the Minecraft decompilation/recompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_version=3.11.3

# Minecraft
minecraft_base_version=1.21
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge
neoforge_version=21.1.234
neoforge_range=[21.1.234,)
# FML loader version range for 1.21.1
loader_range=[4,)

# Parchment mappings
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Build Dependencies — the locally-built, ported Mantle (consumed via composite build)
mantle_version=1.12
mantle_range=[1.12,)

# Optional compat — JEI only (1.21.1 / NeoForge). All other compat is disabled until M6.
jei_version=19.21.0.247
jei_range=[19.21.0.247,)
