# Gradle memory for the Minecraft decompilation/recompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Registers the JBR 21 (DCEVM) install as a discoverable toolchain so the clientHotswap run
# can select it via javaLauncher (Gradle 8+ rejects a raw `executable` override that disagrees
# with the toolchain-derived javaLauncher — see build.gradle's clientHotswap task config).
org.gradle.java.installations.paths=C:/Users/aleja/tools/jbr21

mod_version=3.11.3

# Minecraft
minecraft_base_version=1.21
minecraft_version=1.21.4
minecraft_range=[1.21.4,1.21.5)

# NeoForge
neoforge_version=21.4.161
neoforge_range=[21.4.161,)
# FML loader version range for 1.21.4
loader_range=[4,)

# Parchment mappings
parchment_minecraft=1.21.4
parchment_version=2025.03.23

# Build Dependencies — the locally-built, ported Mantle (consumed via composite build)
mantle_version=1.12
mantle_range=[1.12,)

# Optional compat (1.21.4 / NeoForge)
jei_version=20.0.0.4
jei_range=[20.0.0.4,)
# Crafting Tweaks (+ Balm, its required library)
craftingtweaks_version=21.4.5+1.21.4
balm_version=21.4.42+1.21.4
# EXCLUDED on 1.21.4 (no build / maven down) — re-add in compat phase
# JSON Things (data-driven items/blocks) — standalone; artifact name embeds the MC version
jsonthings_version=0.13.7
# EXCLUDED on 1.21.4 (no build / maven down) — re-add in compat phase
# Immersive Engineering (chemthrower fluid effects + shield disabling) — standalone, from Jared's maven
ie_version=1.21.1-12.4.2-194
