pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Build the ported Mantle from source and substitute it for the published coordinate.
// Explicit substitution because the requested version string will not match the source build's version.
includeBuild('../repo') {
    dependencySubstitution {
        substitute module('slimeknights.mantle:Mantle') using project(':')
    }
}

rootProject.name = 'TConstruct'
