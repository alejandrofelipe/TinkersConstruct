/*
 * Tinkers' Construct — master build file
 * Ported to NeoGradle 7.1.38 / NeoForge 21.1.234 / MC 1.21.1 / JDK 21.
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'io.freefair.lombok' version '8.6'
    id 'jacoco'
}

repositories {
    mavenCentral()
    maven { name "Prog's Maven"; url 'https://dvs1.progwml6.com/files/maven' }
    maven { name "Jared's maven"; url 'https://maven.blamejared.com/' }
}

group = 'slimeknights.tconstruct'
base { archivesName = 'TinkersConstruct' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

task buildInfo {
    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        // stable dev version — mirrors Mantle (repo/build.gradle): the git-hash suffix was cwd-dependent
        // (git ran from the workspace root, which is NOT a repo, and fell back to "GITBORK"), churning the
        // version and rewriting the jar every compile
        ext.buildNum = "DEV"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) { artifact_version = "${mod_version}.${project.buildInfo.buildNum}" }
if (System.getenv().ARTIFACT_VERSION != null) { artifact_version = "${System.getenv().ARTIFACT_VERSION}" }
version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, Version: ${version}"

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

subsystems {
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

sourceSets {
    main {
        resources {
            srcDirs "src/generated/resources"
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
        }
        java {
            exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
            exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
            exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
            exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
        }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'tconstruct'
    }
    // long-lived client with live class reload: JBR 21 + HotswapAgent (external mode).
    // JVM is forced below via javaLauncher toolchain override — see the top-level tasks.matching
    // block after this runs{} block for why a raw `executable` override doesn't work here.
    clientHotswap {
        runType 'client'
        // JBR's DCEVM: allows structural class redefinition (not just method bodies)
        jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        // reloads are triggered explicitly via jdb attach + redefine (see hotswap.ps1) — the same
        // JDI path IDE hotswap uses. HotswapAgent's autoHotswap watcher proved unreliable under
        // ModLauncher/Windows (watcher registered but never delivered events in 2 of 3 sessions).
        jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
    }
    // self-driving GUI screenshot suite: quick-plays into the committed UITest world, runs the
    // registered scenarios, writes uitest-screenshots/ + uitest-results.json, exits on its own.
    clientUiTest {
        runType 'client'
        systemProperty 'mantle.uitest', 'true'
        // focused runs: gradlew runClientUiTest -PuitestOnly=station_ keeps only scenarios whose id
        // path contains the token(s) (comma-separated substrings). See UiTestSuite#filtered.
        if (project.hasProperty('uitestOnly')) {
            systemProperty 'mantle.uitest.only', project.property('uitestOnly')
        }
        arguments.addAll '--quickPlaySingleplayer', 'UITest', '--width', '1280', '--height', '720'
    }
    server { argument '--nogui' }
    data {
        arguments.addAll '--mod', 'tconstruct', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath(),
            '--existing-mod', 'mantle'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'tconstruct'
    }
}

// NeoGradle run tasks use the toolchain launcher (Temurin); hotswap needs the JBR's DCEVM.
// Gradle 8+ JavaExec always validates `executable` against `javaLauncher` (JavaExec.exec() calls
// getJavaLauncher().get() unconditionally, even when executable is set directly) and throws
// "Toolchain from `executable` property does not match toolchain from `javaLauncher` property"
// if they disagree — setting javaLauncher to null does NOT help, since the property falls back
// to its convention (the project toolchain) rather than skipping validation. The supported fix
// (see https://github.com/gradle/gradle/issues/25345 — raw executable overrides outside the
// toolchain system are no longer supported by design) is to select the JBR as a real toolchain
// via javaLauncher instead of overriding executable. The JBR path is registered as a discoverable
// toolchain via org.gradle.java.installations.paths in gradle.properties; it reports its vendor as
// JetBrains (`java -version` -> "JBR-21.0.11+..."), matched here via JvmVendorSpec.JETBRAINS.
tasks.matching { it.name == 'runClientHotswap' }.configureEach {
    it.javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.JETBRAINS
    })
}

// extracts the committed uitest world into the clientUiTest run dir, wiping the previous copy so
// every suite run starts from the same pristine state (scenarios are not idempotent across runs —
// e.g. a leftover full fuel tank from the prior run trips SmelteryRigs.fillTank's fail-fast guard).
tasks.register('prepareUiTestWorld', Copy) {
    from zipTree(file('src/uitest/uitest-world.zip'))
    into file('run/clientUiTest/saves')
    doFirst {
        delete file('run/clientUiTest/saves/UITest')
    }
}
tasks.matching { it.name == 'runClientUiTest' }.configureEach { dependsOn 'prepareUiTestWorld' }

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    // Gradle 9 no longer puts a JUnit Platform Launcher on the test runtime classpath itself;
    // without this, ':test' fails before running anything ("Failed to load JUnit Platform").
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

jacoco { toolVersion = '0.8.12' }

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Coverage TARGET is the pure-logic surface. Exclude code not unit-testable in isolation (covered by
// uitest / runData / load, not unit tests): client render/screens, datagen providers, compat plugins,
// registration holders, gametests, and generated/mixin.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    def coverageExclusions = [
        'slimeknights/tconstruct/**/client/**',
        'slimeknights/tconstruct/**/*Screen*',
        'slimeknights/tconstruct/**/*Renderer*',
        'slimeknights/tconstruct/**/*Model*',
        'slimeknights/tconstruct/**/data/**',
        'slimeknights/tconstruct/**/*Provider*',
        'slimeknights/tconstruct/plugin/**',
        'slimeknights/tconstruct/gametest/**',
        // "Tinker*" registration holders (DeferredRegister/DeferredHolder dumps), one per feature
        // module. Scoped to everything OUTSIDE library/ -- see the library/-specific list below for
        // why: the "Tinker*" prefix is the mod's naming convention, not a reliable holder signal.
        'slimeknights/tconstruct/common/**/Tinker*',
        'slimeknights/tconstruct/fluids/**/Tinker*',
        'slimeknights/tconstruct/gadgets/**/Tinker*',
        'slimeknights/tconstruct/shared/**/Tinker*',
        'slimeknights/tconstruct/smeltery/**/Tinker*',
        'slimeknights/tconstruct/tables/**/Tinker*',
        'slimeknights/tconstruct/tools/**/Tinker*',
        'slimeknights/tconstruct/world/**/Tinker*',
        // library/ is the coverage baseline's seed package (see coverage task report), so a blanket
        // "Tinker*" exclude was too coarse here: it also caught real logic, not just holders --
        // TinkerDataCapability.Holder (a per-entity data map with put/add/remove/get) and
        // TinkerPredicate (entity/damage/item match helpers). Listing the confirmed holders/dummy
        // stubs explicitly instead keeps those two measured. classDirectories holds compiled .class
        // files (not .java sources), and the trailing "*" also sweeps up nested/synthetic classes
        // (e.g. lambda bodies) the top-level class compiles into.
        'slimeknights/tconstruct/library/TinkerBookIDs*.class',
        'slimeknights/tconstruct/library/TinkerItemDisplays*.class',
        'slimeknights/tconstruct/library/json/TinkerLoadables*.class',
        'slimeknights/tconstruct/library/recipe/TinkerRecipeTypes*.class',
        'slimeknights/tconstruct/library/recipe/ingredient/TinkerIngredients*.class',
        'slimeknights/tconstruct/library/tools/capability/TinkerDataKeys*.class',
        'slimeknights/tconstruct/library/tools/item/TinkerTier*.class',
        'slimeknights/tconstruct/library/utils/TinkerTooltipFlags*.class',
    ]
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version'        : artifact_version,
        'loader_range'   : loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range' : neoforge_range,
        'mantle_range'   : mantle_range,
        'jei_range'      : jei_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : "Tinkers Construct",
            "Specification-Vendor"    : "Slime Knights",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "Slime Knights",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java { withSourcesJar() }
sourcesJar {
    exclude 'assets/**'; exclude 'data/**'; exclude 'pack.png'
    exclude 'pack.mcmeta'; exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar; artifact sourcesJar } }
    repositories { if (project.hasProperty('DEPLOY_DIR')) { maven { url DEPLOY_DIR } } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000', '-Xmaxwarns', '100000'])
}
