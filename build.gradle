/*
 * Tinkers' Construct — master build file
 * Ported to NeoGradle 7.1.39 / NeoForge 21.4.161 / MC 1.21.4 / JDK 21 (M1).
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
    id 'io.freefair.lombok' version '8.6'
    id 'jacoco'
}

repositories {
    mavenCentral()
    maven { name "Prog's Maven"; url 'https://dvs1.progwml6.com/files/maven' }
    maven { name "Jared's maven"; url 'https://maven.blamejared.com/' }
    maven { name "TwelveIterations"; url 'https://maven.twelveiterations.com/repository/maven-public/'; content { includeGroup 'net.blay09.mods' } }
    // JSON Things; the regex (not just dev.gigaherz.jsonthings) also covers its transitive runtime dep dev.gigaherz.rhinolib:rhino-lib
    maven { name "Dogforce Games"; url 'https://www.dogforce-games.com/maven/'; content { includeGroupByRegex 'dev\\.gigaherz.*' } }
    // Mojang's download host, objects addressed by SHA-1; only serves the 1.21.4 client jar for the spawn egg templates (see below)
    exclusiveContent {
        forRepository {
            ivy {
                name 'Mojang piston-data'
                url 'https://piston-data.mojang.com/v1/objects/'
                patternLayout { artifact '[revision]/[artifact].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'com.mojang.piston-data' }
    }
}

group = 'slimeknights.tconstruct'
base { archivesName = 'TinkersConstruct' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
// the freefair 8.6 default (Lombok 1.18.32) crashes javac 25 (TypeTag.UNKNOWN is gone); 1.18.40+ supports JDK 25
lombok { version = '1.18.42' }

task buildInfo {
    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        // stable dev version — mirrors Mantle (repo/build.gradle): the git-hash suffix was cwd-dependent
        // (git ran from the workspace root, which is NOT a repo, and fell back to "GITBORK"), churning the
        // version and rewriting the jar every compile
        ext.buildNum = "DEV"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) { artifact_version = "${mod_version}.${project.buildInfo.buildNum}" }
if (System.getenv().ARTIFACT_VERSION != null) { artifact_version = "${System.getenv().ARTIFACT_VERSION}" }
version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, Version: ${version}"

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

sourceSets {
    main {
        java {
            // EXCLUDED since 1.21.4: no Immersive Engineering build for the current MC version
            exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
        }
        resources {
            srcDirs "src/generated/resources"
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
        }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {}
    // long-lived client with live class reload: JBR 21 + HotswapAgent (external mode).
    // JVM is forced below via javaLauncher toolchain override — see the top-level tasks.matching
    // block after this runs{} block for why a raw `executable` override doesn't work here.
    clientHotswap {
        runType 'client'
        // JBR's DCEVM: allows structural class redefinition (not just method bodies)
        jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        // reloads are triggered explicitly via jdb attach + redefine (see hotswap.ps1) — the same
        // JDI path IDE hotswap uses. HotswapAgent's autoHotswap watcher proved unreliable under
        // ModLauncher/Windows (watcher registered but never delivered events in 2 of 3 sessions).
        jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
    }
    // self-driving GUI screenshot suite: quick-plays into the committed UITest world, runs the
    // registered scenarios, writes uitest-screenshots/ + uitest-results.json, exits on its own.
    clientUiTest {
        runType 'client'
        systemProperty 'mantle.uitest', 'true'
        // focused runs: gradlew runClientUiTest -PuitestOnly=station_ keeps only scenarios whose id
        // path contains the token(s) (comma-separated substrings). See UiTestSuite#filtered.
        if (project.hasProperty('uitestOnly')) {
            systemProperty 'mantle.uitest.only', project.property('uitestOnly')
        }
        // gradlew runClientUiTest -PuitestTags=jei,compat keeps only scenarios having any of the tags (UiTestTags);
        // combined with -PuitestOnly both filters apply. See UiTestSuite#select.
        if (project.hasProperty('uitestTags')) {
            systemProperty 'mantle.uitest.tags', project.property('uitestTags')
        }
        arguments.addAll '--quickPlaySingleplayer', 'UITest', '--width', '1280', '--height', '720'
    }
    server { argument '--nogui' }
    data {
        // 1.21.4: NeoForge replaced the vanilla `data` run type with `clientData`/`serverData`
        // (the GatherDataEvent -> .Client/.Server split). Keep the block named `data` so the Gradle
        // task stays `runData`; point it at the `clientData` run type. `--all` still drives every
        // registered provider.
        // No --existing-mod: ExistingFileHelper was removed in 1.21.4 and neither the clientData nor the
        // serverData launch target registers that option (it throws UnrecognizedOptionException). Existing
        // resources are read through the GatherDataEvent ResourceManager instead.
        runType 'clientData'
        // the spawn egg template layers come from the 1.21.4 client jar, see spawnEggTemplateJar below
        arguments.addAll '--mod', 'tconstruct', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }
    // 1.21.4: the GatherDataEvent.Client/.Server split needs a second run for the data-side providers
    // (recipes/tags/loot/advancements/fluid_transfer). Mirrors `data` but on the `serverData` run type.
    // Run BOTH (`runData` + `runServerData`) to regenerate.
    serverData {
        runType 'serverData'
        arguments.addAll '--mod', 'tconstruct', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }
    // 1.21.5: runs every registered test instance (NeoForge dropped the neoforge.enabledGameTestNamespaces filter).
    // Focused run: gradlew runGameTestServer -PgametestOnly=tconstruct:smeltery_* (vanilla --tests selector, wildcards ok)
    gameTestServer {
        if (project.hasProperty('gametestOnly')) {
            arguments.addAll '--tests', project.property('gametestOnly').toString()
        }
    }
}

// NeoGradle run tasks use the toolchain launcher (Temurin); hotswap needs the JBR's DCEVM.
// Gradle 8+ JavaExec always validates `executable` against `javaLauncher` (JavaExec.exec() calls
// getJavaLauncher().get() unconditionally, even when executable is set directly) and throws
// "Toolchain from `executable` property does not match toolchain from `javaLauncher` property"
// if they disagree — setting javaLauncher to null does NOT help, since the property falls back
// to its convention (the project toolchain) rather than skipping validation. The supported fix
// (see https://github.com/gradle/gradle/issues/25345 — raw executable overrides outside the
// toolchain system are no longer supported by design) is to select the JBR as a real toolchain
// via javaLauncher instead of overriding executable. The JBR path is registered as a discoverable
// toolchain via org.gradle.java.installations.paths in gradle.properties; it reports its vendor as
// JetBrains (`java -version` -> "JBR-21.0.11+..."), matched here via JvmVendorSpec.JETBRAINS.
// 26.1: the game needs Java 25, so this needs a JBR 25 registered in org.gradle.java.installations.paths
// (the JBR 21 there no longer matches; without a JBR 25 Gradle's toolchain resolution would try to provision one).
tasks.matching { it.name == 'runClientHotswap' }.configureEach {
    it.javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.JETBRAINS
    })
}

// extracts the committed uitest world into the clientUiTest run dir, wiping the previous copy so
// every suite run starts from the same pristine state (scenarios are not idempotent across runs —
// e.g. a leftover full fuel tank from the prior run trips SmelteryRigs.fillTank's fail-fast guard).
tasks.register('prepareUiTestWorld', Copy) {
    from zipTree(file('src/uitest/uitest-world.zip'))
    into file('run/clientUiTest/saves')
    doFirst {
        delete file('run/clientUiTest/saves/UITest')
    }
}
tasks.matching { it.name == 'runClientUiTest' }.configureEach { dependsOn 'prepareUiTestWorld' }

// the uitest client always exits 0 (UiTestSuite stops it normally after writing the results), so the task reads
// uitest-results.json itself: it fails when the file is missing or older than this run (the client died before the
// suite finished) or when any result, mantle:suite_setup included, is neither "ok" nor a "warn: ..." note
def uiTestResultsFile = file('run/clientUiTest/uitest-results.json')
// the previous run's results are kept next to its PNGs (uitest-screenshots-previous, rotated by UiTestSuite) for comparison
def uiTestPreviousResultsFile = file('run/clientUiTest/uitest-results-previous.json')
tasks.matching { it.name == 'runClientUiTest' }.configureEach {
    def startedAt = 0L
    doFirst {
        startedAt = System.currentTimeMillis()
        if (uiTestResultsFile.isFile()) {
            delete uiTestPreviousResultsFile
            if (!uiTestResultsFile.renameTo(uiTestPreviousResultsFile)) {
                delete uiTestResultsFile
            }
        }
    }
    doLast {
        if (!uiTestResultsFile.isFile() || uiTestResultsFile.lastModified() < startedAt) {
            throw new GradleException("uitest: ${uiTestResultsFile} was not written by this run; the suite did not finish (see run/clientUiTest/logs/latest.log)")
        }
        Map<String, Object> results = new groovy.json.JsonSlurper().parse(uiTestResultsFile, 'UTF-8') as Map<String, Object>
        // "warn: ..." results (e.g. mantle:world_upgrade) are reported without failing the task
        Map<String, Object> warned = results.findAll { id, result -> result instanceof String && result.startsWith('warn:') }
        warned.each { id, result -> logger.warn("uitest: ${id}: ${result}") }
        Map<String, Object> failed = results.findAll { id, result -> result != 'ok' && !warned.containsKey(id) }
        if (!results.containsKey('mantle:suite_setup')) {
            failed['mantle:suite_setup'] = 'missing'
        }
        if (!failed.isEmpty()) {
            throw new GradleException("uitest: ${failed.size()} of ${results.size()} result(s) not ok (${uiTestResultsFile}):\n"
                + failed.collect { id, result -> "  ${id}: ${result}" }.join('\n'))
        }
        logger.lifecycle("uitest: all ${results.size() - warned.size()} result(s) ok" + (warned.isEmpty() ? "" : ", ${warned.size()} warning(s)"))
    }
}

// the gametest server reuses run/gameTestServer/world across runs (vanilla never deletes it), so leftovers
// from a previous run (placed structures, datapack state, generated chunks) leak into the next one. Wipe it
// so every run generates a fresh flat world.
tasks.register('cleanGameTestWorld', Delete) {
    delete file('run/gameTestServer/world')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'cleanGameTestWorld' }

// JSON Things reads thingpacks from <game dir>/thingpacks only, so the gametest server gets a fresh copy of the test pack
// (JsonThingsGameTests) on every run
tasks.register('prepareGameTestThingpacks', Sync) {
    from file('src/gametest/thingpacks')
    into file('run/gameTestServer/thingpacks')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'prepareGameTestThingpacks' }

// SpawnEggTextureProvider tints Mojang's spawn egg template layers (assets/minecraft/textures/item/spawn_egg.png and
// spawn_egg_overlay.png), removed from the game in 1.21.5. They are not committed: they are read from the 1.21.4 client jar
// (-PspawnEggTemplateJar=<path> points at it directly), found by its SHA-1 in the NeoGradle/ForgeGradle caches or a launcher's
// files when already on this machine, otherwise downloaded once from Mojang into the Gradle cache (the client download of
// https://piston-meta.mojang.com/v1/packages/148e7e24fc222fdb21b0b90c6ee0d63da082a84a/1.21.4.json) and checked by its SHA-1.
// runData fails without it; SpawnEggTextureTest skips the check against it.
def spawnEggTemplateSha1 = 'a7e5a6024bfd3cd614625aa05629adf760020304'
def spawnEggTemplateSize = 28335587L
configurations {
    spawnEggTemplateClient {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    spawnEggTemplateClient "com.mojang.piston-data:client:${spawnEggTemplateSha1}@jar"
}
def isSpawnEggTemplateJar = { File jar -> jar.isFile() && jar.length() == spawnEggTemplateSize && jar.bytes.digest('SHA-1') == spawnEggTemplateSha1 }
// the jar, or a GradleException saying why there is none
def spawnEggTemplateJar = { ->
    if (project.hasProperty('spawnEggTemplateJar')) {
        return file(project.property('spawnEggTemplateJar'))
    }
    def caches = new File(gradle.gradleUserHomeDir, 'caches')
    def appData = System.getenv('APPDATA') ?: System.getProperty('user.home')
    def candidates = []
    def ngExecute = new File(caches, 'ng_execute')
    if (ngExecute.isDirectory()) {
        ngExecute.eachDir { candidates << new File(it, 'client.jar') }
    }
    candidates += [
        new File(caches, 'minecraft/versions/1.21.4/client.jar'),
        new File(caches, 'forge_gradle/minecraft_repo/versions/1.21.4/client.jar'),
        new File(appData, '.minecraft/versions/1.21.4/1.21.4.jar'),
        new File(appData, 'PrismLauncher/libraries/com/mojang/minecraft/1.21.4/minecraft-1.21.4-client.jar')
    ]
    def local = candidates.find(isSpawnEggTemplateJar)
    if (local != null) {
        return local
    }
    def missing = "The 1.21.4 client jar (SHA-1 ${spawnEggTemplateSha1}) holding the spawn egg template layers was not found in the Gradle caches or launcher files"
    File downloaded
    try {
        downloaded = configurations.spawnEggTemplateClient.singleFile
    } catch (Exception e) {
        def cause = e
        while (cause.cause != null && cause.cause != cause) { cause = cause.cause }
        throw new GradleException("${missing} and could not be downloaded from piston-data.mojang.com (${cause.message}); "
            + 'run once online, run 1.21.4 once (any launcher) or pass -PspawnEggTemplateJar=<path to the jar>', e)
    }
    if (!isSpawnEggTemplateJar(downloaded)) {
        throw new GradleException("${missing}, and the jar downloaded from piston-data.mojang.com (${downloaded}) does not match that SHA-1/size; "
            + 'delete it from the Gradle cache and retry, or pass -PspawnEggTemplateJar=<path to the jar>')
    }
    return downloaded
}
tasks.matching { it.name == 'runData' }.configureEach {
    doFirst {
        def jar = spawnEggTemplateJar()
        if (!jar.isFile()) {
            throw new GradleException("-PspawnEggTemplateJar=${jar} is not a file")
        }
        systemProperty 'tconstruct.datagen.spawnEggTemplateJar', jar.absolutePath
    }
}
tasks.named('test') {
    doFirst {
        try {
            def jar = spawnEggTemplateJar()
            if (jar.isFile()) {
                systemProperty 'tconstruct.test.spawnEggTemplateJar', jar.absolutePath
            }
        } catch (GradleException e) {
            logger.warn("SpawnEggTextureTest will skip the check against the real template layers: ${e.message}")
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation "slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Crafting Tweaks compat (optional; Balm is its required library). compileOnly compiles the
    // plugin without pulling the mods into every run; add runtimeOnly to smoke-test in dev.
    compileOnly "net.blay09.mods:craftingtweaks-neoforge:${craftingtweaks_version}"
    compileOnly "net.blay09.mods:balm-neoforge:${balm_version}"
    // runtimeOnly so the compat actually loads in dev runs (smoke test / uitest); harmless in prod (dep only).
    runtimeOnly "net.blay09.mods:craftingtweaks-neoforge:${craftingtweaks_version}"
    runtimeOnly "net.blay09.mods:balm-neoforge:${balm_version}"
    // Balm 26.1.2.15 pulls kuma-api 26.1.2.2, whose key modifier reconcile recurses until the client crashes at startup (StackOverflowError
    // in KeyMapping.kuma$getModifiers); a newer kuma-api replaces it at runtime
    runtimeOnly "net.blay09.mods:kuma-api-neoforge:${kuma_version}"

    // JSON Things compat (optional, standalone). Artifact name embeds the MC version.
    // runtimeOnly so the plugin loads in dev runs (the gametest server loads the thingpack under src/gametest/thingpacks)
    compileOnly "dev.gigaherz.jsonthings:JsonThings-${minecraft_version}:${jsonthings_version}"
    runtimeOnly "dev.gigaherz.jsonthings:JsonThings-${minecraft_version}:${jsonthings_version}"

    // EXCLUDED since 1.21.4 (no Immersive Engineering build for the current MC version); the plugin source is excluded
    // in sourceSets above — re-add the deps + source when one exists.
    // Immersive Engineering compat (optional, standalone; Jared's maven).
    // compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}"
    // runtimeOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    // Gradle 9 no longer puts a JUnit Platform Launcher on the test runtime classpath itself;
    // without this, ':test' fails before running anything ("Failed to load JUnit Platform").
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // 26.1.2 (Java 25): Mockito 5.20 brings Byte Buddy 1.17.7, the first with Java 25 class file support (static mocks in BaseMcTest)
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

// 26.1.2 (Java 25): JaCoCo 0.8.14 is the first release that officially supports Java 25 class files
jacoco { toolVersion = '0.8.14' }

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Coverage TARGET is the pure-logic surface. Exclude code not unit-testable in isolation (covered by
// uitest / runData / load, not unit tests): client render/screens, datagen providers, compat plugins,
// registration holders, gametests, and generated/mixin.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    def coverageExclusions = [
        'slimeknights/tconstruct/**/client/**',
        'slimeknights/tconstruct/**/*Screen*',
        'slimeknights/tconstruct/**/*Renderer*',
        'slimeknights/tconstruct/**/*Model*',
        'slimeknights/tconstruct/**/data/**',
        'slimeknights/tconstruct/**/*Provider*',
        'slimeknights/tconstruct/plugin/**',
        'slimeknights/tconstruct/gametest/**',
        // "Tinker*" registration holders (DeferredRegister/DeferredHolder dumps), one per feature
        // module. Scoped to everything OUTSIDE library/ -- see the library/-specific list below for
        // why: the "Tinker*" prefix is the mod's naming convention, not a reliable holder signal.
        'slimeknights/tconstruct/common/**/Tinker*',
        'slimeknights/tconstruct/fluids/**/Tinker*',
        'slimeknights/tconstruct/gadgets/**/Tinker*',
        'slimeknights/tconstruct/shared/**/Tinker*',
        'slimeknights/tconstruct/smeltery/**/Tinker*',
        'slimeknights/tconstruct/tables/**/Tinker*',
        'slimeknights/tconstruct/tools/**/Tinker*',
        'slimeknights/tconstruct/world/**/Tinker*',
        // library/ is the coverage baseline's seed package (see coverage task report), so a blanket
        // "Tinker*" exclude was too coarse here: it also caught real logic, not just holders --
        // TinkerDataCapability.Holder (a per-entity data map with put/add/remove/get) and
        // TinkerPredicate (entity/damage/item match helpers). Listing the confirmed holders/dummy
        // stubs explicitly instead keeps those two measured. classDirectories holds compiled .class
        // files (not .java sources), and the trailing "*" also sweeps up nested/synthetic classes
        // (e.g. lambda bodies) the top-level class compiles into.
        'slimeknights/tconstruct/library/TinkerBookIDs*.class',
        'slimeknights/tconstruct/library/TinkerItemDisplays*.class',
        'slimeknights/tconstruct/library/json/TinkerLoadables*.class',
        'slimeknights/tconstruct/library/recipe/TinkerRecipeTypes*.class',
        'slimeknights/tconstruct/library/recipe/ingredient/TinkerIngredients*.class',
        'slimeknights/tconstruct/library/tools/capability/TinkerDataKeys*.class',
        'slimeknights/tconstruct/library/tools/item/TinkerTier*.class',
        'slimeknights/tconstruct/library/utils/TinkerTooltipFlags*.class',
    ]
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version'        : artifact_version,
        'loader_range'   : loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range' : neoforge_range,
        'mantle_range'   : mantle_range,
        'jei_range'      : jei_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : "Tinkers Construct",
            "Specification-Vendor"    : "Slime Knights",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "Slime Knights",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // MIT (SlimeKnights): the copyright + permission notice must ship in every copy; bundle LICENSE at the jar root.
    from("LICENSE")
}

java { withSourcesJar() }
sourcesJar {
    exclude 'assets/**'; exclude 'data/**'; exclude 'pack.png'
    exclude 'pack.mcmeta'; exclude 'META-INF/neoforge.mods.toml'
}

publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar; artifact sourcesJar } }
    repositories { if (project.hasProperty('DEPLOY_DIR')) { maven { url DEPLOY_DIR } } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000', '-Xmaxwarns', '100000'])
}
